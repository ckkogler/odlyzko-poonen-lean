      and small-factor bounds. No result from this source is an assumed input.
      Its general coefficient and Galois-group results are not claimed here.
  - title: Irreducibility of random polynomials of large degree
    authors: [Emmanuel Breuillard, Péter P. Varjú]
    id: https://arxiv.org/abs/1810.13360v2
    type: paper
