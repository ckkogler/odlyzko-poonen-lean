status:
  scope: >-
    The proved development includes irreducibility, sharp reducibility estimates,
    cyclotomic factorization and degree bounds, a strengthened reciprocal-divisor
    estimate, signed difference-multiset counts with exponential error, an explicit
    three-term expansion, and periodic half-power expansions to every fixed order.
    All selected mathematical targets are proved; the
    phase-retrieval application is outside the selected scope. The complete
    local build and axiom audit, strict comparison of 35 claims, NanoDa and Lean
    kernel replays, metadata and license validation, and fresh authored checkout
    build passed. Exact checked snapshots are recorded in verification/.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [GPT-6 (Codex)]
      framework: Codex
      tool_setup: >-
        Human-directed autonomous Lean proof development with compiler feedback,
        Mathlib tactics, exact finite diagnostics, semantic and axiom inspections,
        and durable checkpoints. No unchecked proof certificates are used.
      prompting_notes: >-
        Formalize every result and supporting input with the original hypotheses,
        constants and floors. Preserve prior projects, record source discrepancies,
        and prepare an independently reproducible local submission without publishing.
  notes: >-
    Constantin Kogler supplied project direction and the mathematical source.
    Codex authored and revised proofs and inspected their statements and axiom lists.
    Model identifiers across earlier context segments were not exhaustively recorded.
    Costs and total model-inference time were not reliably aggregated.
fidelity:
  divergences: >-
    The explicit three-term and arbitrary-order periodic half-power expansions
    are proved and included in the completed local verification.
    Proved statements preserve their mathematical hypotheses and constants.
    The phase-retrieval application is outside the selected scope; polynomial
    autocorrelation and signed difference-multiset consequences are included.
    The parameter m of binaryProbability counts internal coefficients,
    so degree n uses m=n-1, with a proved uniform-counting equivalence. The value
    at n=0 is a total extension irrelevant to the asymptotic statements. An algebraic
    proof of the factor constants replaces the positivity argument; that positivity
    observation is separately proved. The arithmetic inputs are proved through
    controlled separating primes, confluent determinants and sparse coefficients.
    The strengthened reciprocal-divisor proof averages selected-bit weights
    exactly and uses a prime interval with absolute upper factor sixteen;
    these alternatives preserve the stated final probability bounds. Separate
    concentration results use the interval from T to 2T and the actual word law.
    No general Breuillard–Varju theorem, sharper external Mahler bound, historical
    result mentioned only for context, or historical conjecture beyond the stated
    source targets is claimed. A proved sign-normalization equivalence removes monicity from the reciprocal-divisor witnesses in the compared finite and asymptotic estimates. No confirmed mathematical source error was found.
review:
  status: agent-reviewed
  reviewers: []
  notes: >-
    The developing agent inspected full statements, definitions, all standard-only
    axiom lists, finite-model indexing, quantifier order, constants, floors,
    real exponents and uniformity of the asymptotic errors. The actual strict
    Comparator and both required kernel replays accepted all 35 selected claims.
    A fresh authored checkout reproduced the full statement output. Current
    verification records identify the exact checked proof and configuration
    bytes; historical records retain their own scope. There is no separate
    human review, registry acceptance, or remote CI result.
alignment:
  namespace: OdlyzkoPoonen
  coverage_index: COVERAGE.md
  statements:
    - source: "Model: the sampled family consists exactly of monic endpoint-one binary polynomials of degree m+1."
      lean: OdlyzkoPoonen.mem_binaryFamily_iff
      module: OdlyzkoPoonen.Polynomial.BinaryWords
      status: proved
    - source: "Model: precisely 2^m polynomials have m internal binary coefficients."
      lean: OdlyzkoPoonen.card_binaryFamily
      module: OdlyzkoPoonen.Polynomial.BinaryWords
      status: proved
    - source: "Model: fair independent internal bits give uniform counting on the polynomial family."
      lean: OdlyzkoPoonen.binaryProbability_eq_count
      module: OdlyzkoPoonen.Probability.BinaryModel
      status: proved
    - source: "Theorem 1.1: the probability of irreducibility over the rationals tends to one."
      lean: OdlyzkoPoonen.odlyzko_poonen_irreducibility
      module: OdlyzkoPoonen.Asymptotics.Reducibility
      status: proved
    - source: "Theorem 1.1: reducibility differs from the minus-one root event by O(1/n)."
      lean: OdlyzkoPoonen.binaryProbability_reducible_excess_isBigO
      module: OdlyzkoPoonen.Asymptotics.Reducibility
      status: proved
    - source: "Theorem 1.1: one positive constant bounds that nonnegative difference by C/n for all sufficiently large degrees."
      lean: OdlyzkoPoonen.exists_reducible_probability_excess_bound
      module: OdlyzkoPoonen.Asymptotics.Reducibility
      status: proved
    - source: "Theorem 1.1: the reducibility probability is sqrt(2/(pi*n)) with O(1/n) error."
      lean: OdlyzkoPoonen.binaryProbability_reducible_asymptotic
      module: OdlyzkoPoonen.Asymptotics.Reducibility
      status: proved
    - source: "Theorem 1.3: the probability of a genuine modulo-four companion is bounded by the exact degree-split sum, itself at most 8*(3/4)^floor((n-1)/4)."
      lean: OdlyzkoPoonen.mod_four_companion_probability
      module: OdlyzkoPoonen.ModFour.CompanionProbability
      status: proved
    - source: "Proposition 2.1: independent uniform degree-d and degree-e endpoint-one polynomials over F2 satisfy the joint nonreciprocity/congruence event with probability at most 2*(3/4)^floor((e-1)/2)."
      lean: OdlyzkoPoonen.factor_pair_congruence_probability
      module: OdlyzkoPoonen.ModFour.FactorProbability
      status: proved
    - source: "Lemma 3.1: reversing either monic integer factor preserves binarity and autocorrelation; the two trivial outcomes occur exactly when the corresponding factor is reciprocal. Both factors have constant one."
      lean: OdlyzkoPoonen.binary_factor_reversal
      module: OdlyzkoPoonen.Polynomial.FactorReversal
      status: proved
    - source: "Estimate (3.1): the degree of the gcd of the reduction modulo two and its reciprocal has tail at most 8*2^(-L/2). This includes every natural cutoff L."
      lean: OdlyzkoPoonen.reciprocal_gcd_probability_le_eight
      module: OdlyzkoPoonen.Asymptotics.ReciprocalBounds
      status: proved
    - source: "Auxiliary fixed-factor estimate: one absolute positive a and threshold work for every degree and every rationally irreducible noncyclotomic integer factor, with rate exp(-a*n/(log n)^4). No monicity assumption is needed."
      lean: OdlyzkoPoonen.exists_uniform_noncyclotomic_factor_bound
      module: OdlyzkoPoonen.Probability.NoncyclotomicFactor
      status: proved
    - source: "Auxiliary fixed-factor estimate, also with ordinary irreducibility in the integer polynomial ring, including all signs and constant cases."
      lean: OdlyzkoPoonen.exists_uniform_integer_irreducible_noncyclotomic_factor_bound
      module: OdlyzkoPoonen.Probability.NoncyclotomicFactor
      status: proved
    - source: "Auxiliary finite bound: a nonconstant reciprocal divisor with no cyclotomic divisor of the original polynomial has probability at most exp(4*L^2-a*n/(log n)^4)+8*2^(-L/2), uniformly in L."
      lean: OdlyzkoPoonen.exists_unrestricted_reciprocal_finite_bound_eight
      module: OdlyzkoPoonen.Asymptotics.ReciprocalBounds
      status: proved
    - source: "Auxiliary estimate: the same reciprocal/noncyclotomic event has probability O_A(n^(-A)) for every real A>0."
      lean: OdlyzkoPoonen.binaryProbability_unrestricted_reciprocal_noncyclotomic_isBigO
      module: OdlyzkoPoonen.Asymptotics.ReciprocalDivisorNormalization
      status: proved
    - source: "Estimate (3.2): reducibility without any cyclotomic divisor has probability O_A(n^(-A)) for every real A>0."
      lean: OdlyzkoPoonen.binaryProbability_reducible_noncyclotomic_isBigO
      module: OdlyzkoPoonen.Asymptotics.ReducibleNoncyclotomic
      status: proved
    - source: "Estimate (3.3): the probability of a cyclotomic factor of degree at least two is O(1/n)."
      lean: OdlyzkoPoonen.binaryProbability_higher_cyclotomic_isBigO
      module: OdlyzkoPoonen.Asymptotics.HigherCyclotomic
      status: proved
    - source: "Exact odd-degree formula: for degree 2r+1 the minus-one root probability is choose(2r,r)/2^(2r), including degree one."
      lean: OdlyzkoPoonen.binaryProbability_minus_one_odd
      module: OdlyzkoPoonen.Probability.MinusOne
      status: proved
    - source: "Exact even-degree formula: for degree 2r the probability is choose(2r-1,r+1)/2^(2r-1), including the zero value at degree two."
      lean: OdlyzkoPoonen.binaryProbability_minus_one_even
      module: OdlyzkoPoonen.Probability.MinusOne
      status: proved
    - source: "Minus-one asymptotic: its probability is sqrt(2/(pi*n)) with the stronger O(n^(-3/2)) error."
      lean: OdlyzkoPoonen.binaryProbability_minus_one_asymptotic
      module: OdlyzkoPoonen.Asymptotics.MinusOneAsymptotic
      status: proved
    - source: "Signed difference multiplicities are equivalent to reciprocal-product coefficients."
      lean: OdlyzkoPoonen.differenceMultiset_eq_iff_autocorrelation_eq
      module: OdlyzkoPoonen.Polynomial.DifferenceMultiset
      status: proved
    - source: "Reflection preserves every signed-difference multiplicity."
      lean: OdlyzkoPoonen.differenceMultiset_reflectedSet
      module: OdlyzkoPoonen.Polynomial.SetReflection
      status: proved
    - source: "Exactly 2^floor(n/2) endpoint-fixed subsets are invariant under reflection."
      lean: OdlyzkoPoonen.card_reflection_fixed_binarySetFamily
      module: OdlyzkoPoonen.Polynomial.SetReflection
      status: proved
    - source: "Finite lower and upper bounds for distinct signed difference multisets, including degree one."
      lean: OdlyzkoPoonen.differenceMultisetFamily_card_bounds
      module: OdlyzkoPoonen.Combinatorics.DifferenceMultisetCount
      status: proved
    - source: "The endpoint-fixed count is 2^(n-2) with error O(12^(n/4)), using a real exponent."
      lean: OdlyzkoPoonen.differenceMultisetFamily_asymptotic
      module: OdlyzkoPoonen.Asymptotics.DifferenceMultisets
      status: proved
    - source: "The free-upper-endpoint count is 2^(n-1) with the same exponential error rate."
      lean: OdlyzkoPoonen.anchoredDifferenceMultisetFamily_exponential_asymptotic
      module: OdlyzkoPoonen.Asymptotics.AnchoredDifferenceRate
      status: proved
    - source: "The free-upper-endpoint signed-difference count is 2^(n-1)+o(2^n)."
      lean: OdlyzkoPoonen.anchoredDifferenceMultisetFamily_asymptotic
      module: OdlyzkoPoonen.Asymptotics.AnchoredDifferences
      status: proved
    - source: "A fixed finite collection of cyclotomic divisibility events approximates reducibility to every natural inverse power."
      lean: OdlyzkoPoonen.binaryProbability_reducible_finite_cyclotomic_approximation
      module: OdlyzkoPoonen.Asymptotics.FiniteCyclotomicApproximation
      status: proved
    - source: "The first correction to the minus-one root probability has coefficients -17/4 and 1/4 according to degree parity."
      lean: OdlyzkoPoonen.binaryProbability_minus_one_first_correction_asymptotic
      module: OdlyzkoPoonen.Asymptotics.MinusOneExpansion
      status: proved
    - source: "The reducibility probability has a half-power expansion to every fixed order, with coefficients depending only on the degree modulo a fixed period."
      lean: OdlyzkoPoonen.binaryProbability_reducible_periodic_expansion
      module: OdlyzkoPoonen.Asymptotics.ReducibilityExpansion
      status: proved

    - source: "The reducibility probability is A*n^(-1/2)+B*n^(-1)+A*(delta_n-2*B)*n^(-3/2)+O(n^(-2)), with A=sqrt(2/pi), B=4*(1+sqrt(3))/pi and delta_n=-17/4 for even n, 1/4 for odd n."
      lean: OdlyzkoPoonen.binaryProbability_reducible_three_term_expansion
      module: OdlyzkoPoonen.Asymptotics.ExplicitReducibilityExpansion
      status: proved

    - source: "Theorem 1.2: for every n>=3, a cyclotomic product times one irreducible noncyclotomic integer polynomial has probability at least 1-C*exp(-c*n/(log n)^4); the same factorization with cyclotomic degree at most sqrt(n) has probability at least 1-C*exp(-c*sqrt(n)), using the same absolute positive constants."
      lean: OdlyzkoPoonen.cyclotomic_irreducible_factorization_probability
      module: OdlyzkoPoonen.Reducibility.CyclotomicIrreducibleProbability
      status: proved
    - source: "Finite cutoff: cyclotomic degree below L, for 1<=L<=n, with logarithmic exponential error plus 8*2^(-L/2)."
      lean: OdlyzkoPoonen.cyclotomic_irreducible_factorization_cutoff_probability
      module: OdlyzkoPoonen.Reducibility.CyclotomicCutoffProbability
      status: proved
    - source: "Proposition 3.3: for every n>=3, the probability of a monic reciprocal divisor that is not a cyclotomic product is at most C*exp(-c*n/(log n)^4), without restricting the sampled polynomial."
      lean: OdlyzkoPoonen.noncyclotomic_reciprocal_divisor_probability
      module: OdlyzkoPoonen.Probability.NoncyclotomicReciprocalDivisor
      status: proved
    - source: "Lemma 3.2: the probability of any monic reciprocal integer divisor of degree at least L is at most 8*2^(-L/2)."
      lean: OdlyzkoPoonen.binaryProbability_large_reciprocal_divisor_le_eight
      module: OdlyzkoPoonen.Probability.ReciprocalDivisorTail
      status: proved
