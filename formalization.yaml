      The fixed-factor and cyclotomic inputs needed for the specified fixed-endpoint
      binary law are proved within this repository. The general results of this
      source are not claimed. No Riemann hypothesis or literature theorem is an axiom.
  - title: An effective lower bound for the height of algebraic numbers
    authors: [Paul Voutier]
    id: https://arxiv.org/abs/1211.3110
    type: paper
    relationship: background
    note: >-
      The determinant method informs the quantitative Mahler input. The contained
      proof uses a coarser confluent determinant bound and proves the weaker uniform
      logarithmic gap sufficient here; it does not claim this source's full bound.
