version: v0.4
project:
  name: The Odlyzko–Poonen conjecture
  description: >-
    Irreducibility and sharp reducibility asymptotics for uniformly random monic
    integer polynomials with constant coefficient one and intermediate coefficients
    zero or one. Rational irreducibility has probability tending to one;
    reducibility equals the minus-one root probability, and sqrt(2/(pi*n)),
    each up to O(1/n). The development also proves the exact modulo-four
    autocorrelation companion bound, independent factor-pair estimate,
    reciprocal-factor bounds, uniform noncyclotomic fixed-factor estimate,
    cyclotomic bound and exact binomial identities needed for these conclusions.
    Signed difference multisets satisfy exact counting bounds with exponential
    error. Reducibility has an explicit three-term expansion, including its
    parity correction, and a periodic half-power expansion to every fixed order.
    A cyclotomic product times one irreducible noncyclotomic integer polynomial
    occurs with failure probability at most C*exp(-c*n/(log n)^4); the same
    factorization with cyclotomic degree at most sqrt(n) has failure probability
    at most C*exp(-c*sqrt(n)), with the same absolute positive constants. The
    strengthened reciprocal-divisor estimate and finite cutoff are also proved.
  authors: [Constantin Kogler]
  responsible_maintainers: [Constantin Kogler]
  license: 0BSD
classification:
  arxiv: [math.NT, math.PR]
  msc2020: [11C08, 60C05]
