status:
  scope: >-
    The proved development includes irreducibility, sharp reducibility estimates,
    cyclotomic factorization and degree bounds, a strengthened reciprocal-divisor
    estimate, signed difference-multiset counts with exponential error, an explicit
    three-term expansion, and periodic half-power expansions to every fixed order.
    All selected mathematical targets are proved; the phase-retrieval application
    is outside the selected scope. Challenge states three main theorems and three
    preliminary model lemmas. The complete default build, all statement and axiom
    checks, strict comparison of six claims, NanoDa and Lean kernel replays,
    metadata and license validation, and fresh authored checkout build passed.
    Exact checked snapshots are recorded in verification/.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [GPT-6 (Codex)]
      framework: Codex
      tool_setup: >-
        Human-directed autonomous Lean proof development with compiler feedback,
        Mathlib tactics, exact finite diagnostics, semantic and axiom inspections,
        and durable checkpoints. No unchecked proof certificates are used.
      prompting_notes: >-
        Formalize every result and supporting input with the original hypotheses,
        constants and floors. Preserve prior projects, record source discrepancies,
        and prepare an independently reproducible local submission without publishing.
  notes: >-
    Constantin Kogler supplied project direction and the mathematical source.
    Codex authored and revised proofs and inspected their statements and axiom lists.
    Model identifiers across earlier context segments were not exhaustively recorded.
    Costs and total model-inference time were not reliably aggregated.
fidelity:
  divergences: >-
    The explicit three-term and arbitrary-order periodic half-power expansions
    are proved and included in the completed local verification.
    Proved statements preserve their mathematical hypotheses and constants.
    The phase-retrieval application is outside the selected scope; polynomial
    autocorrelation and signed difference-multiset consequences are included.
    The parameter m of binaryProbability counts internal coefficients,
    so degree n uses m=n-1, with a proved uniform-counting equivalence. The value
    at n=0 is a total extension irrelevant to the asymptotic statements. An algebraic
    proof of the factor constants replaces the positivity argument; that positivity
    observation is separately proved. The arithmetic inputs are proved through
    controlled separating primes, confluent determinants and sparse coefficients.
    The strengthened reciprocal-divisor proof averages selected-bit weights
    exactly and uses a prime interval with absolute upper factor sixteen;
    these alternatives preserve the stated final probability bounds. Separate
    concentration results use the interval from T to 2T and the actual word law.
    No general Breuillard–Varju theorem, sharper external Mahler bound, historical
    result mentioned only for context, or historical conjecture beyond the stated
    source targets is claimed. A proved sign-normalization equivalence removes monicity from the reciprocal-divisor witnesses in the compared finite and asymptotic estimates. No confirmed mathematical source error was found.
review:
  status: agent-reviewed
  reviewers: []
  notes: >-
    The developing agent inspected definitions, finite-model indexing, quantifier
    order, constants, floors, real exponents and uniformity of asymptotic errors.
    The comparison now selects three main theorems and three preliminary model
    lemmas. Their actual full types and explicit definitions were reviewed, and
    the strict Comparator and both required kernel replays accepted all six.
    The fresh authored checkout reproduced the full statement output. Current
    evidence identifies exact checked sources; historical receipts retain their
    own scope. Recorded GitHub verification covers the compiler-portability
    update and the same mathematical sources. There is no separate human review
    or registry acceptance.
alignment:
  namespace: OdlyzkoPoonen
  coverage_index: COVERAGE.md
  statements:
    - source: "Model: the sampled family consists exactly of monic endpoint-one binary polynomials of degree m+1."
      lean: OdlyzkoPoonen.mem_binaryFamily_iff
      module: OdlyzkoPoonen.Polynomial.BinaryWords
      status: proved
    - source: "Model: precisely 2^m polynomials have m internal binary coefficients."
      lean: OdlyzkoPoonen.card_binaryFamily
      module: OdlyzkoPoonen.Polynomial.BinaryWords
      status: proved
    - source: "Model: fair independent internal bits give uniform counting on the polynomial family."
      lean: OdlyzkoPoonen.binaryProbability_eq_count
      module: OdlyzkoPoonen.Probability.BinaryModel
      status: proved
    - source: "Theorem 1.1: rational irreducibility has probability tending to one, and the reducibility probability is sqrt(2/(pi*n)) with error O(1/n)."
      lean: OdlyzkoPoonen.irreducibility_and_reducibility_asymptotic
      module: OdlyzkoPoonen.MainResults
      status: proved
    - source: "Theorem 1.2: for every n>=3, a cyclotomic product times one irreducible noncyclotomic integer polynomial has probability at least 1-C*exp(-c*n/(log n)^4); the same factorization with cyclotomic degree at most sqrt(n) has probability at least 1-C*exp(-c*sqrt(n)), using the same absolute positive constants."
      lean: OdlyzkoPoonen.cyclotomic_irreducible_factorization_probability
      module: OdlyzkoPoonen.Reducibility.CyclotomicIrreducibleProbability
      status: proved
    - source: "Theorem 1.3: for every n>=1, the probability of a genuine modulo-four reciprocal-product companion is at most 8*(3/4)^floor((n-1)/4)."
      lean: OdlyzkoPoonen.mod_four_companion_probability_le
      module: OdlyzkoPoonen.ModFour.CompanionProbability
      status: proved
